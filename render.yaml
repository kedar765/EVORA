services:
  - type: web
    name: evora-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EVORA_COOKIE_SECURE
        value: "true"
      - key: EVORA_COOKIE_SAMESITE
        value: "none"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: EVORA_TRUSTED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANALYTICS_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RISK_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DECISION_GEMINI_MODEL
        value: gemini-2.5-flash
